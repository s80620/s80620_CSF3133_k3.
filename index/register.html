
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <header>
        <h1>Registration Form</h1>
        <p>Please fill in your information below.</p>
    </header>

    <nav>
        <a href="lab2_ExerA.html">Return to Main Page</a>
    </nav>

    <main>
        <section id="register">
            <h2>Register for the Event</h2>

            <form action="#" method="post">
                <p>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname"
                           name="fullname" required>
                </p>

                <p>
                    <label for="matric">Matric Number:</label>
                    <input type="text" id="matric"
                           name="matric" required>
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email"
                           name="email" required>
                </p>

                <fieldset>
                    <legend>Year of Study:</legend>

                    <label>
                        <input type="radio" name="year"
                               value="Year 1" required>
                        Year 1
                    </label>

                    <label>
                        <input type="radio" name="year"
                               value="Year 2">
                        Year 2
                    </label>

                    <label>
                        <input type="radio" name="year"
                               value="Year 3">
                        Year 3
                    </label>

                    <label>
                        <input type="radio" name="year"
                               value="Year 4">
                        Year 4
                    </label>
                </fieldset>

                <br>

                <fieldset>
                    <legend>Choose Your Sessions:</legend>

                    <label>
                        <input type="checkbox" name="sessions"
                               value="Web Design">
                        Web Design
                    </label>

                    <label>
                        <input type="checkbox" name="sessions"
                               value="Programming">
                        Programming
                    </label>

                    <label>
                        <input type="checkbox" name="sessions"
                               value="Cybersecurity">
                        Cybersecurity
                    </label>
                </fieldset>

                <br>

                <p>
                    <label for="programme">Programme/Faculty:</label>
                    <select id="programme" name="programme" required>
                        <option value="">-- Select Programme --</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Software Engineering">Software Engineering</option>
                        <option value="Multimedia">Multimedia</option>
                    </select>
                </p>

                <button type="submit">Register</button>
                <button type="reset">Clear Form</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Faculty Event Registration</p>
    </footer>

</body>
</html>
